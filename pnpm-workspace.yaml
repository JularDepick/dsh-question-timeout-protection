# pnpm workspace 声明,隔离用户家目录的全局 workspace 文件
packages:
  - .

# 内容寻址 store 固定在工作区内(沙箱环境避免写工作区外被拒,相对本文件解析)
storeDir: .pnpm-store

# 公开提升全部依赖到根 node_modules
#
# Node 26 的 JS 版 realpathSync 不再解析 Windows junction,而 pnpm 隔离布局
# 在 Windows 上用 junction 链接顶层包,嵌套依赖解析会落到 junction 路径上并报
# ERR_MODULE_NOT_FOUND。本项仅影响本地开发环境的 node_modules 布局,不随包发布。
publicHoistPattern:
  - '*'

# pnpm 的供应链策略要求新发布版本等待一段时间才可安装; 0.2.2-rc.2 与 Cordis 4.1.0 是刚发布的新版本,
# 在此按精确版本豁免, 供本地安装与类型检查使用。
minimumReleaseAgeExclude:
  - '@deepseek-ai/cordis@4.1.0'
  - '@deepseek-ai/cosmokit@1.9.0'
  - '@deepseek-ai/dsh-agent@0.2.2-rc.2'
  - '@deepseek-ai/dsh-brand@0.2.2-rc.2'
  - '@deepseek-ai/dsh-client-locale@0.2.2-rc.2'
  - '@deepseek-ai/dsh-client-ui-conversation@0.2.2-rc.2'
  - '@deepseek-ai/dsh-client-ui-primitives@0.2.2-rc.2'
  - '@deepseek-ai/dsh-client-ui-renderer@0.2.2-rc.2'
  - '@deepseek-ai/dsh-client-ui-settings@0.2.2-rc.2'
  - '@deepseek-ai/dsh-client-ui-slots@0.2.2-rc.2'
  - '@deepseek-ai/dsh-llm@0.2.2-rc.2'
  - '@deepseek-ai/dsh-scope@0.2.2-rc.2'
  - '@deepseek-ai/dsh-session-projection@0.2.2-rc.2'
  - '@deepseek-ai/dsh-session@0.2.2-rc.2'
  - '@deepseek-ai/dsh-system-prompt@0.2.2-rc.2'
  - '@deepseek-ai/dsh-timeout@0.2.2-rc.2'
  - '@deepseek-ai/dsh-tools@0.2.2-rc.2'
  - '@deepseek-ai/dsh-typert-protocol@0.2.2-rc.2'
  - '@deepseek-ai/dsh-user-approval@0.2.2-rc.2'
  - '@deepseek-ai/dsh-user-questions@0.2.2-rc.2'
  - '@deepseek-ai/dsh-util-crypto@0.2.2-rc.2'
  - '@deepseek-ai/dsh-util-values@0.2.2-rc.2'
  - '@deepseek-ai/schemastery@3.19.0'
  - '@deepseek-ai/dsh-error@0.2.2-rc.2'
